name: Build Android APK
on:
  push:
    branches: [main, feature/android-apk]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Publish APK on the same branch
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/verdant-ventures-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/verdant-ventures-debug.apk
          git commit -m 'Publish Android test APK' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: verdant-ventures-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
