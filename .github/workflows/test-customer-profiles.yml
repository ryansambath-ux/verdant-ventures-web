name: Test customer profile access
on:
  push:
    branches: [feature/customer-profiles]
    paths:
      - 'tests/**'
      - 'firestore.customer-profile-candidate.rules'
      - '.github/workflows/test-customer-profiles.yml'
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: npm test
        working-directory: tests
